    <style>
      .layer-controls {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      .controls label.toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 600 11px ui-monospace, "SF Mono", monospace;
        color: var(--paper);
        cursor: pointer;
      }
      .controls label.mode {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: 600 11px ui-monospace, "SF Mono", monospace;
        color: var(--paper);
      }
      .controls select {
        font: 600 11px ui-monospace, "SF Mono", monospace;
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.55);
        color: var(--paper);
        cursor: pointer;
      }
    </style>

  <body>
    <div id="map"></div>
    <div class="badge">
      <h1>Deutsches Heeresgitter</h1>
      <p><a href="https://www.npmjs.com/package/@zwaarcontrast/ol-graticule-heeresgitter"><code>@zwaarcontrast/ol-graticule-heeresgitter</code></a></p>
      <p>WWII Wehrmacht grids: the <strong>Heeresgitter</strong> Gauß-Krüger lattice and the orange <strong>Heeresmeldenetz</strong> letter-cell overprint, in both planar (6 km) and geographic (6′ × 4′) variants. <a href="../">← All demos</a></p>
      <div class="controls layer-controls">
        <label class="mode">
          Grid:
          <select id="mode">
            <option value="dhg">Heeresgitter</option>
            <option value="hmn" selected>Heeresmeldenetz (planar)</option>
            <option value="hmn-geo">Heeresmeldenetz (geographic)</option>
          </select>
        </label>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>

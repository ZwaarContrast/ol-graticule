name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to read-only; jobs that need more (coverage) opt in explicitly.
permissions:
  contents: read

# Cancel superseded runs on the same branch (saves minutes on fast follow-up pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `format:check` exists as a script but isn't enforced in CI — the
      # existing codebase predates Prettier and would fail wholesale. Run
      # `npm run format` locally (or as a one-time sweep) to align it.

  test:
    name: Node ${{ matrix.node }} × ol@${{ matrix.ol }}
    runs-on: ubuntu-latest
    strategy:
      # One failing cell shouldn't mask issues in the others.
      fail-fast: false
      matrix:
        # Node versions match `engines.node: ">=20.0.0"`: the oldest supported
        # (20, end of life but still in `engines`), the LTS lines and current.
        node: [20, 22, 24, 26]
        # OL version matches `peerDependencies: { "ol": "^10.0.0" }`.
        ol: ['10']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Override the locked OL version for this job only. `--no-save` keeps the
      # lockfile pristine so the matrix doesn't cross-contaminate itself.
      - name: Install ol@${{ matrix.ol }}
        run: npm install --no-save ol@${{ matrix.ol }}

      # `tsc --build` typechecks AND emits the dist/ that sibling packages need
      # to resolve `@zwaarcontrast/ol-graticule` via workspace symlinks at test
      # time — so we must build before testing.
      - run: npm run build

      - run: npm test

  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: lock
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  e2e:
    name: Visual regression
    needs: playwright-version
    runs-on: ubuntu-latest
    # Image matching the locked @playwright/test, in which the committed snapshots are generated.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v7
      # No setup-node: the image ships Node 24, which is what the committed
      # baselines were generated on. Swapping it would diverge from them.
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            demos/playwright-report
            demos/test-results
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - name: Coverage report
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2

name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment; cancel in-progress runs so a quick
# follow-up push doesn't wait for the prior deploy to finish.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build the library packages first so the demos can resolve them via
      # workspace symlinks (they import `@zwaarcontrast/ol-graticule`, etc.).
      - run: npm run build
      - run: npm run build --workspace=ol-graticule-demos
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demos/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

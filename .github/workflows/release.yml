name: Release

on:
  push:
    branches: [main]

# Serialize release runs on main — avoids racing version PRs or publishes.
concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # The changesets action needs to open/update PRs, push version commits,
    # and (when publishing) request an OIDC token for npm provenance.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Changesets walks the full history to figure out what's unreleased.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          # Makes setup-node write an .npmrc that picks up NODE_AUTH_TOKEN
          # during `npm publish` (which `changeset publish` shells out to).
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Pre-build so both the "Version Packages" PR job and the publish job
      # have fresh dist/ output — the root `release` script also builds, so
      # this is belt-and-suspenders, but cheap and avoids publishing stale bits.
      - run: npm run build

      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          # When there are pending changesets: opens/updates a "Version Packages"
          # PR that bumps versions and updates CHANGELOG.md via your
          # `npm run version` script (it runs `changeset version` + the
          # aggregate-changelog helper).
          version: npm run version
          # When there are no pending changesets (i.e. a version PR just
          # merged), runs your existing `release` script — `npm run build &&
          # changeset publish` — to push to npm.
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Sign published tarballs via GitHub OIDC so consumers can verify
          # they came from this repo + workflow. Requires `id-token: write`
          # above. Drop this env var if you'd rather not publish provenance.
          NPM_CONFIG_PROVENANCE: 'true'

name: Release

on:
  push:
    branches: [main]

# Serialize release runs on main — avoids racing version PRs or publishes.
concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Gates the OIDC token claim that npm trusted-publisher entries require
    # (`environment: prd`). Reviewers / branch policies can be layered on
    # in repo Settings → Environments → prd if you want manual approvals
    # before a publish proceeds.
    environment: prd
    # The changesets action needs to open/update PRs, push version commits,
    # and (when publishing) request an OIDC token for npm provenance.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets walks the full history to figure out what's unreleased.
          fetch-depth: 0

      # Node 24 ships npm 11.x, which is the minimum that supports npm
      # trusted publishing (the OIDC token exchange backing our `prd`
      # trusted-publisher entries). Consumer-facing test coverage for the
      # `engines.node: ">=20.0.0"` minimum lives in `ci.yml`; this workflow
      # only builds + publishes, so the build-time Node version is
      # independent of what consumers run.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          # Deliberately NO `registry-url` here. Setting it makes setup-node
          # write an `.npmrc` with `_authToken=${NODE_AUTH_TOKEN}`, which the
          # npm CLI then treats as "auth is configured" — and silently skips
          # the OIDC trusted-publisher exchange, falling back to (empty)
          # token-based publishing. Letting npm see no auth lets it detect
          # the GitHub OIDC environment and use trusted publishing instead.

      - run: npm ci

      # Pre-build so both the "Version Packages" PR job and the publish job
      # have fresh dist/ output — the root `release` script also builds, so
      # this is belt-and-suspenders, but cheap and avoids publishing stale bits.
      - run: npm run build

      - name: Create Release PR or publish to npm
        uses: changesets/action@v2
        with:
          # When there are pending changesets: opens/updates a "Version Packages"
          # PR that bumps versions and updates CHANGELOG.md via your
          # `npm run version` script (it runs `changeset version` + the
          # aggregate-changelog helper).
          version: npm run version
          # When there are no pending changesets (i.e. a version PR just
          # merged), runs your existing `release` script — `npm run build &&
          # changeset publish` — to push to npm.
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No `NODE_AUTH_TOKEN`. Authentication runs through npm trusted
          # publishing (OIDC) — see the trusted-publisher entries on npm
          # for each `@zwaarcontrast/ol-graticule*` package.
          # Sign published tarballs via GitHub OIDC so consumers can verify
          # they came from this repo + workflow. Requires `id-token: write`
          # above. Drop this env var if you'd rather not publish provenance.
          NPM_CONFIG_PROVENANCE: 'true'
